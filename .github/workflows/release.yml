# Al subir una etiqueta de versión (por ejemplo v0.1.7) se compilan los instaladores de Windows y de Mac
# y se publican en el Release de GitHub, junto con los archivos que usa la actualización automática.
# El Release se crea como BORRADOR y solo se publica cuando Windows y Mac terminaron de subir sus archivos:
# así la app nunca ve una versión nueva sin su latest.yml (daba «Cannot find latest.yml» durante la compilación).
# También se puede lanzar a mano (Actions > Publicar versión > Run workflow) indicando una etiqueta existente.
name: Publicar versión

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta a compilar y publicar (ej. v0.1.6)'
        required: true

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Crear el Release si no existe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --title "Creatuchat ${TAG#v}" --notes "Instaladores de Windows y Mac. La app se actualiza sola desde el botón Actualizar."

  instaladores:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            objetivo: --win
          - os: macos-latest
            objetivo: --mac
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compilar
        run: npx electron-builder ${{ matrix.objetivo }} --publish never
      - name: Subir al Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          archivos=(dist/*.exe dist/*.dmg dist/*.zip dist/*.blockmap dist/latest*.yml)
          echo "Subiendo ${#archivos[@]} archivos"
          gh release upload "$TAG" "${archivos[@]}" --repo "$GITHUB_REPOSITORY" --clobber

  publicar:
    needs: instaladores
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publicar el Release (ya tiene todos los archivos)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
