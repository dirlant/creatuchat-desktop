<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Creatuchat</title>
<style>
  :root{color-scheme:light dark;--bg:#f0f2f5;--card:#fff;--text:#111b21;--sub:#667781;--line:#d1d7db;--green:#00a884;--err:#ea0038}
  @media (prefers-color-scheme:dark){:root{--bg:#0b141a;--card:#111b21;--text:#e9edef;--sub:#8696a0;--line:#2a3942;--err:#f15c6d}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
  main{width:100%;max-width:400px;padding:22px 24px;background:var(--card);border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.12)}
  img{display:block;margin:0 auto 6px;width:68px;height:68px}
  h1{margin:0 0 4px;font-size:19px;text-align:center}
  p.sub{margin:0 0 14px;color:var(--sub);text-align:center;font-size:13px}
  label{display:block;margin:10px 0 4px;font-weight:600;font-size:13px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--text);font:inherit}
  input:focus{outline:2px solid var(--green);border-color:transparent}
  small{display:block;margin-top:3px;color:var(--sub);font-size:12px}
  button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:12px;background:var(--green);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  #err{min-height:18px;margin-top:10px;color:var(--err);font-size:13px;text-align:center}
  .priv{margin-top:8px;color:var(--sub);font-size:11.5px;text-align:center}
</style>
</head>
<body>
<main>
  <img src="../ext/icons/logo.png" alt="Creatuchat">
  <h1>Bienvenido a Creatuchat</h1>
  <p class="sub">Antes de empezar, cuéntanos quién eres. Es solo una vez.</p>
  <form id="f" novalidate>
    <label for="nombre">Nombre</label>
    <input id="nombre" autocomplete="name" placeholder="Tu nombre">
    <label for="correo">Correo electrónico</label>
    <input id="correo" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com">
    <label for="numero">Número de WhatsApp que vas a usar</label>
    <input id="numero" inputmode="tel" autocomplete="tel" placeholder="Ej: 584121234567">
    <small>Con el código de país, sin «+» ni espacios.</small>
    <button id="ok" type="submit">Continuar</button>
    <div id="err" role="alert"></div>
  </form>
  <p class="priv">Usamos estos datos para darte soporte y avisarte de novedades de Creatuchat.</p>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  ct.info().then((i) => { if (i && i.registro) { $('nombre').value = i.registro.nombre || ''; $('correo').value = i.registro.correo || ''; $('numero').value = i.registro.numero || ''; } });
  $('nombre').focus();
  $('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const nombre = $('nombre').value.trim(), correo = $('correo').value.trim(), numero = $('numero').value.replace(/\D/g, '');
    const err = (m) => { $('err').textContent = m; };
    if (nombre.length < 2) return err('Escribe tu nombre.');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(correo)) return err('Escribe un correo válido.');
    if (numero.length < 8 || numero.length > 15) return err('Escribe tu número de WhatsApp con el código de país (8 a 15 dígitos).');
    err(''); $('ok').disabled = true; $('ok').textContent = 'Guardando…';
    const r = await ct.registrar({ nombre, correo, numero });
    if (r && r.ok) return; // el proceso principal cierra esta ventana y abre WhatsApp
    $('ok').disabled = false; $('ok').textContent = 'Continuar';
    err((r && r.error) || 'No se pudo guardar. Revisa tu conexión a internet e inténtalo de nuevo.');
  });
</script>
</body>
</html>
