<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Creatuchat</title>
<style>
  :root{color-scheme:light dark;--bg:#f0f2f5;--card:#fff;--text:#111b21;--sub:#667781;--line:#d1d7db;--green:#00a884;--err:#ea0038}
  @media (prefers-color-scheme:dark){:root{--bg:#0b141a;--card:#111b21;--text:#e9edef;--sub:#8696a0;--line:#2a3942;--err:#f15c6d}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
  main{width:100%;max-width:400px;padding:24px;background:var(--card);border-radius:16px;box-shadow:0 2px 14px rgba(0,0,0,.12);text-align:center}
  img{width:68px;height:68px;margin-bottom:4px}
  h1{margin:0 0 8px;font-size:19px}
  p{margin:0 0 6px;color:var(--sub)}
  button{width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;background:var(--green);color:#fff;font:inherit;font-weight:600;cursor:pointer}
  button.alt{background:transparent;color:var(--sub);border:1px solid var(--line);margin-top:8px;font-weight:500}
  button:disabled{opacity:.6;cursor:default}
  .bar{height:8px;margin-top:14px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--green);transition:width .3s}
  #est{min-height:20px;margin-top:10px;font-size:13px}
  #est.bad{color:var(--err)}
</style>
</head>
<body>
<main>
  <img src="../ext/icons/logo.png" alt="Creatuchat">
  <h1>Actualización obligatoria</h1>
  <p>Hay una nueva versión de Creatuchat (<b id="ver"></b>).</p>
  <p>Para seguir usando la versión gratuita debes actualizar primero. Tu sesión de WhatsApp y tu configuración se conservan.</p>
  <button id="go">Actualizar ahora</button>
  <button id="salir" class="alt">Salir</button>
  <div class="bar" id="barra" hidden><i id="prog"></i></div>
  <div id="est"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  ct.info().then((i) => { $('ver').textContent = (i && i.version) || ''; if (i && i.mac) $('go').textContent = 'Abrir la descarga'; });
  $('salir').onclick = () => ct.salir();
  $('go').onclick = async () => { $('go').disabled = true; $('est').className = ''; $('est').textContent = 'Preparando la actualización…'; const r = await ct.actualizar(); if (r && r.error) { $('go').disabled = false; $('est').className = 'bad'; $('est').textContent = r.error; } };
  ct.onEstado((s) => {
    if (s.progreso != null) { $('barra').hidden = false; $('prog').style.width = Math.round(s.progreso) + '%'; }
    if (s.texto) { $('est').className = s.error ? 'bad' : ''; $('est').textContent = s.texto; }
    if (s.error) $('go').disabled = false;
  });
</script>
</body>
</html>
